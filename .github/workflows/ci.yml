name: CI
on:
  pull_request:
  push:
    branches: [main]
  release:
    types: [published]
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
env:
  PUBLIC_SUPABASE_URL: https://ci-placeholder.supabase.co
  PUBLIC_SUPABASE_ANON_KEY: ci-placeholder
  PUBLIC_TURNSTILE_SITE_KEY: ''
  PUBLIC_STRIPE_PUBLISHABLE_KEY: ''
  PUBLIC_URL_BASE: https://3fp.org
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache
          key: ${{ runner.os }}-lint-${{ hashFiles('package-lock.json', 'eslint.config.js', '.prettierrc', '.prettierignore', '.gitignore', 'tsconfig.json') }}-${{ github.sha }}
          restore-keys: |
            ${{ runner.os }}-lint-${{ hashFiles('package-lock.json', 'eslint.config.js', '.prettierrc', '.prettierignore', '.gitignore', 'tsconfig.json') }}-
      - run: npm run lint
      - run: npm run check:ci
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      DEPLOY_TARGET: node
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm run test:server-sanitizer
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_USER: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      ACCOUNTING_TEST_DATABASE_URL: postgres://postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test

  deploy-farin:
    if: github.event_name == 'push' || (github.event_name == 'release' && github.event.release.prerelease == false)
    needs: [verify, build, tests]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    concurrency:
      group: farin-production-deploy
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ github.event_name == 'release' && github.event.release.tag_name || github.sha }}
          persist-credentials: false
      - id: source
        run: echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Configure Farin SSH access
        env:
          FARIN_DEPLOY_KEY: ${{ secrets.FARIN_DEPLOY_KEY }}
        run: |
          install -m 0700 -d "$RUNNER_TEMP/farin-ssh"
          printf '%s\n' "$FARIN_DEPLOY_KEY" > "$RUNNER_TEMP/farin-ssh/id_ed25519"
          chmod 0600 "$RUNNER_TEMP/farin-ssh/id_ed25519"
          cat > "$RUNNER_TEMP/farin-ssh/known_hosts" <<'KNOWN_HOSTS'
          |1|urp2kSNXnF+vFdDWNmiubssBMkg=|Gir5NUSASb80nItU+dOzPqfiPsA= ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIHMqLpd1OkAh3mykfr8zgpUYE1HyJNHAuSDv3Bbz6LVm
          KNOWN_HOSTS
          chmod 0600 "$RUNNER_TEMP/farin-ssh/known_hosts"
      - name: Deploy the checked commit or release
        env:
          DEPLOY_REF: ${{ github.ref }}
          DEPLOY_SHA: ${{ steps.source.outputs.sha }}
        run: |
          printf '%s\n%s\n' "$DEPLOY_REF" "$DEPLOY_SHA" | ssh -T \
            -i "$RUNNER_TEMP/farin-ssh/id_ed25519" \
            -o BatchMode=yes \
            -o IdentitiesOnly=yes \
            -o StrictHostKeyChecking=yes \
            -o UserKnownHostsFile="$RUNNER_TEMP/farin-ssh/known_hosts" \
            -o ConnectTimeout=15 \
            -o ServerAliveInterval=30 \
            -o ServerAliveCountMax=40 \
            3fp-deploy@45.142.194.24
